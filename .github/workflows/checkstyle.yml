name: Build Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Assemble Debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :chimeroid-app:assembleFreeDebug

      - name: Rename APK
        run: |
          mv chimeroid-app/build/outputs/apk/free/debug/chimeroid-app-free-debug.apk \
             chimeroid-app/build/outputs/apk/free/debug/ChimeroidDebug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chimeroid-APK
          path: chimeroid-app/build/outputs/apk/free/debug/ChimeroidDebug*.apk
          if-no-files-found: error
