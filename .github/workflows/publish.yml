name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.17.0)'
        required: true
        default: 'v1.17.0'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build release APK
        env:
          STORE_FILE: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew :chimeroid-app:assembleFreeRelease

      - name: Rename APK
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          mv chimeroid-app/build/outputs/apk/free/release/chimeroid-app-free-release.apk \
             chimeroid-app/build/outputs/apk/free/release/Chimeroid-${TAG}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chimeroid-APK
          path: chimeroid-app/build/outputs/apk/free/release/Chimeroid-*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Chimeroid-APK
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Chimeroid ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: ./apk/Chimeroid-*.apk
